name: Feature request
description: Suggest something SwitchCard should do.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Use placeholder values only (for example EXAMPLE-SW1 and 192.0.2.0/24).
        Never paste a real configuration, credential, hostname, address or site name.
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: The task you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could SwitchCard help?
      description: What it could do, or the editcontent.txt lines you would expect (placeholders only).
  - type: input
    id: platform
    attributes:
      label: Switch models and IOS XE release
      placeholder: "IE-3400-8T2S, 17.x.y"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request contains no real configuration, credential, hostname, address or site name.
          required: true
