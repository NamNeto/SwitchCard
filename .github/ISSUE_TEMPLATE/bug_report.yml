name: Bug report
description: Something in SwitchCard does not work as documented.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use placeholder values only (for example EXAMPLE-SW1 and 192.0.2.0/24). Do not attach real
        configurations, project files, team packages or firmware.
        Security problems go through private vulnerability reporting instead; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: SwitchCard version
      description: Shown in the page header, for example v0.7.1.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Edge on Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: With placeholder values.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant editcontent.txt lines or messages
      description: Placeholders only. The SHA-256 from the export confirmation helps.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real configuration, credential, hostname, address or site name.
          required: true
