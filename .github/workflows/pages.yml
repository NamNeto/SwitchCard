name: Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the demo site (the app itself is the page)
        run: |
          mkdir -p site
          cp SwitchCard.html site/index.html
          cp SwitchCard.html site/SwitchCard.html
          sha256sum SwitchCard.html > site/SwitchCard.html.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
